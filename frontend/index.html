<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nextstop - Welcome</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#0f766e",
                        "primary": "#005c55",
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f8;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .text-shadow-sm {
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-hover-effect:active {
            transform: scale(0.96);
            transition: transform 0.1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes ripple {
            from { width: 0; height: 0; opacity: 0.5; }
            to { width: 500px; height: 500px; opacity: 0; }
        }
        .animate-ripple {
            position: absolute;
            transform: translate(-50%, -50%);
            animation: ripple 0.6s linear;
        }
    </style>
</head>
<body class="antialiased">
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center bg-no-repeat transform scale-105 transition-transform duration-10000 ease-linear hover:scale-100" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDUKIoeiK2RE7LZlYjnKlh2RSUsCEYJm0NcfqQDS-tXjbn-3l4e36M8aoJqskGkk2S7oQX4ETi1Rt0gNKaY_0aqc7Mbbe7-cTbwU2ynx1pBLTpHQOHh5wv_MC-64iHzJhsOG1n96dO2rib-E_4pWDN5QJByhDt7aoDQ0T9gSChnMNoVy2ezJpNnzDM7K-FPrOL5hrLvFzItw4SnsbjvXZnChUrzNeMa4gwMXSAxIsPraJb9im4k2n7j3Q')">
<div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/60"></div>
</div>
</div>
<main class="relative z-10 flex flex-col items-center justify-between h-screen w-full px-6 md:px-10 py-12 md:py-24 text-white">
<div class="mt-20 md:mt-0 flex flex-col items-center text-center">
<h1 class="font-display-lg text-display-lg md:text-[64px] tracking-tighter mb-2 text-shadow-sm animate-[fadeIn_0.8s_ease-out]">
                Nextstop
            </h1>
<p class="font-body-lg text-body-lg opacity-90 tracking-wide text-shadow-sm animate-[fadeIn_1s_ease-out_0.2s_both]">
                Plan your trip like a game
            </p>
</div>
<div class="w-full max-w-md flex flex-col items-center animate-[slideUp_0.8s_ease-out_0.4s_both]">
<div class="w-24 h-1 bg-white/20 rounded-full mb-8 overflow-hidden">
<div class="w-1/3 h-full bg-gradient-to-r from-[#0F766E] to-[#2FAE60] rounded-full"></div>
</div>
<button class="w-full h-16 bg-primary-container text-white rounded-xl font-headline-md text-headline-md shadow-lg flex items-center justify-center gap-3 transition-all duration-300 hover:bg-primary active:scale-95 group btn-hover-effect relative overflow-hidden" onclick="window.location.href='interests.html'">
<span>Get Started</span>
<span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="mt-6 font-label-md text-label-md text-white/70">
                Join over 2 million explorers today
            </p>
</div>
</main>
<script>
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
                const bg = document.querySelector('.bg-cover');
                if (bg) {
                    bg.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
                }
            });
        }
        const button = document.querySelector('button');
        button.addEventListener('click', function(e) {
            let x = e.clientX - e.target.offsetLeft;
            let y = e.clientY - e.target.offsetTop;
            let ripple = document.createElement('span');
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('absolute', 'bg-white/30', 'rounded-full', 'pointer-events-none', 'animate-ripple');
            this.appendChild(ripple);
            setTimeout(() => { ripple.remove(); }, 600);
        });
    </script>
</body>
</html>
